<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <button id="toggleMusicBtn">Toggle Music Mode</button>
        <input type="text" id="songUrl" placeholder="Enter song URL">
        <button id="startGameBtn">Start Game</button>
        <button id="pauseGameBtn">Pause Game</button>
        <button id="resetGameBtn">Reset Game</button>
        <div>
            <label for="shapeSelect">Select Shape:</label>
            <select id="shapeSelect">
                <option value="circle">Circle</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
    </div>
    <div class="stats">
        <p>Bounces: <span id="bounceCount">0</span></p>
        <p>Level: <span id="level">1</span></p>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script src="script.js"></script>
</body>
</html>
